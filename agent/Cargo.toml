[package]
name = "agent"
version = "0.1.0"
edition = "2021"

[dependencies]
pelite = "0.10"
reqwest = { version = "0.12", features = ["blocking", "multipart", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
winreg = "0.55"

[profile.release]
opt-level = "s"
lto = true
strip = true
